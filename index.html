<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EspaçoZen — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --azul-escuro: #0a2d5e;
  --azul-medio:  #1a4f9c;
  --azul-claro:  #3b82d8;
  --azul-suave:  #d6e8ff;
  --azul-palido: #eef5ff;
  --amarelo:     #f5c842;
  --amarelo-cl:  #fde98a;
  --borda:       #d1dff5;
  --cinza-suave: #f7f8fc;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Nunito', sans-serif;
  background: linear-gradient(135deg, #0a2d5e 0%, #1a4f9c 55%, #2563c4 100%);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}

/* Formas de fundo */
.bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.bg-shape {
  position: absolute; border-radius: 50%;
  background: rgba(255,255,255,0.04);
}
.bg-shape.s1 { width: 650px; height: 650px; top: -220px; right: -160px; }
.bg-shape.s2 { width: 420px; height: 420px; bottom: -120px; left: -110px; background: rgba(245,200,66,0.06); }
.bg-shape.s3 { width: 220px; height: 220px; top: 42%; left: 6%; }

.card {
  position: relative; z-index: 1;
  background: #fff;
  border-radius: 28px;
  padding: 50px 52px;
  width: 440px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.28);
  animation: fadeUp 0.5s ease;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

.logo-wrap {
  display: flex; flex-direction: column; align-items: center;
  margin-bottom: 36px;
}
.logo-icon {
  width: 70px; height: 70px; border-radius: 20px;
  background: linear-gradient(135deg, #1a4f9c, #3b82d8);
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; margin-bottom: 14px;
  box-shadow: 0 8px 24px rgba(26,79,156,0.35);
}
.logo-title {
  font-family: 'Quicksand', sans-serif;
  font-size: 28px; font-weight: 700; color: #0a2d5e;
  margin-bottom: 4px;
}
.logo-sub { font-size: 13px; color: #94a3b8; font-weight: 600; }

.mel-hint {
  display: flex; align-items: center; gap: 9px;
  background: #fffbeb; border: 1.5px solid #fde68a;
  border-radius: 12px; padding: 10px 14px;
  margin-bottom: 26px;
  font-size: 12.5px; color: #92400e; font-weight: 600;
}

.form-group { margin-bottom: 18px; }
.form-label {
  display: block;
  font-size: 12.5px; font-weight: 800;
  color: #0a2d5e; margin-bottom: 7px;
}
.form-input {
  width: 100%; padding: 12px 16px;
  border: 2px solid #d1dff5;
  border-radius: 12px;
  font-family: 'Nunito', sans-serif;
  font-size: 14px; font-weight: 600;
  color: #0a2d5e; background: #f7f8fc;
  outline: none; transition: all 0.18s;
}
.form-input:focus {
  border-color: #3b82d8; background: #fff;
  box-shadow: 0 0 0 4px rgba(59,130,216,0.12);
}

.btn-login {
  width: 100%; padding: 14px;
  background: linear-gradient(135deg, #1a4f9c 0%, #3b82d8 100%);
  color: #fff; border: none; border-radius: 12px;
  font-family: 'Nunito', sans-serif;
  font-size: 15px; font-weight: 800;
  cursor: pointer; transition: all 0.18s;
  box-shadow: 0 6px 20px rgba(59,130,216,0.35);
  margin-top: 6px;
}
.btn-login:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(59,130,216,0.45); }
.btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

.error-box {
  background: #fef2f2; border: 1.5px solid #fecaca;
  border-radius: 10px; padding: 10px 14px;
  font-size: 13px; color: #dc2626; font-weight: 700;
  margin-bottom: 16px; display: none;
}

.footer-txt {
  text-align: center; margin-top: 26px;
  font-size: 11.5px; color: #cbd5e1; font-weight: 600;
}
</style>
</head>
<body>

<div class="bg">
  <div class="bg-shape s1"></div>
  <div class="bg-shape s2"></div>
  <div class="bg-shape s3"></div>
</div>

<div class="card">
  <div class="logo-wrap">
    <div class="logo-icon">🌿</div>
    <div class="logo-title">EspaçoZen</div>
    <div class="logo-sub">Sistema de Gestão — Área Restrita</div>
  </div>

  <div class="mel-hint">
    🐕 <span>A Mel está te esperando! Faça login para continuar.</span>
  </div>

  <div class="error-box" id="errBox"></div>

  <div class="form-group">
    <label class="form-label">E-mail</label>
    <input type="email" id="inputEmail" class="form-input" placeholder="seu@email.com" autocomplete="email">
  </div>
  <div class="form-group">
    <label class="form-label">Senha</label>
    <input type="password" id="inputSenha" class="form-input" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="btn-login" id="btnLogin" onclick="fazerLogin()">Entrar no Sistema</button>

  <div class="footer-txt">EspaçoZen © 2024 · Acesso exclusivo para funcionários</div>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
  // Se já tem token válido, vai direto pro dashboard
  if (localStorage.getItem('ez_token')) window.location.href = '/dashboard.html';

  async function fazerLogin() {
    const email = document.getElementById('inputEmail').value.trim();
    const senha = document.getElementById('inputSenha').value;
    const btn   = document.getElementById('btnLogin');
    const err   = document.getElementById('errBox');

    err.style.display = 'none';

    if (!email || !senha) {
      err.textContent = 'Preencha e-mail e senha.';
      err.style.display = 'block'; return;
    }

    btn.disabled    = true;
    btn.textContent = 'Entrando...';

    try {
      const data = await apiLogin(email, senha);

      if (!data?.ok) {
        err.textContent = data?.message || 'Erro ao fazer login.';
        err.style.display = 'block'; return;
      }

      localStorage.setItem('ez_token', data.token);
      localStorage.setItem('ez_user',  JSON.stringify(data.funcionario));
      window.location.href = '/dashboard.html';
    } catch {
      err.textContent = 'Não foi possível conectar ao servidor. Verifique sua conexão.';
      err.style.display = 'block';
    } finally {
      btn.disabled    = false;
      btn.textContent = 'Entrar no Sistema';
    }
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });
</script>
</body>
</html>
